<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>PFOS — Encrypted SQLite Financial OS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { obsidian: '#090d16', surface: '#111827', card: '#161f32' }
        }
      }
    };
  </script>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #090d16;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-obsidian text-slate-100 min-h-screen flex flex-col md:flex-row selection:bg-emerald-500/30">

  <!-- ==================== AES-256-GCM SQLITE UNLOCK GATE ==================== -->
  <div id="unlock-gate" class="hidden fixed inset-0 z-[100] bg-obsidian/98 backdrop-blur-xl flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-xs bg-surface border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i data-lucide="shield-check" class="w-7 h-7"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold tracking-tight">Decrypt SQLite Vault</h2>
        <p class="text-xs text-slate-400 mt-1">Your <code class="text-emerald-300">pfos_vault.sqlite</code> is locked with AES-256-GCM</p>
      </div>
      <form onsubmit="PFOS.handleUnlock(event)" class="space-y-3">
        <input id="unlock-pin-input" type="password" inputmode="numeric" minlength="4" maxlength="12" required
          placeholder="Enter Vault PIN"
          class="w-full bg-obsidian border border-slate-700 rounded-xl px-4 py-3 text-center text-lg tracking-widest font-bold text-slate-100 focus:outline-none focus:border-emerald-500" />
        <p id="unlock-error" class="text-xs text-rose-400 min-h-[16px]"></p>
        <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition">
          Decrypt &amp; Open SQLite Vault
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== DESKTOP SIDEBAR ==================== -->
  <aside class="hidden md:flex md:flex-col md:w-64 lg:w-72 bg-surface border-r border-slate-800/80 shrink-0 h-screen sticky top-0 p-4 justify-between">
    <div>
      <div class="flex items-center gap-3 px-2 py-2 mb-5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-white font-extrabold text-lg">₹</div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight leading-tight">PFOS <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 ml-1">SQLite</span></h1>
          <p class="text-[11px] text-slate-400">Encrypted Financial OS</p>
        </div>
      </div>

      <div class="mb-5 px-1">
        <label class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold block mb-1.5 px-1">Active Profile</label>
        <select id="desktop-profile-select" onchange="PFOS.switchProfile(this.value)" class="w-full bg-card border border-slate-700/70 rounded-xl px-3 py-2 text-xs font-medium text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="ALL">All Profiles (Consolidated)</option>
          <option value="PERSONAL">Individual — Personal</option>
          <option value="FAMILY">Family — Household</option>
          <option value="BUSINESS">Freelancer — Business</option>
        </select>
      </div>

      <nav class="space-y-1" id="desktop-nav">
        <button data-tab="home" onclick="PFOS.setTab('home')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Commitments Home</button>
        <button data-tab="accounts" onclick="PFOS.setTab('accounts')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="wallet" class="w-4 h-4"></i> Accounts &amp; Cards</button>
        <button data-tab="timeline" onclick="PFOS.setTab('timeline')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="list-ordered" class="w-4 h-4"></i> Unified Timeline</button>
        <button data-tab="planning" onclick="PFOS.setTab('planning')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="calendar-clock" class="w-4 h-4"></i> Obligations &amp; Plan</button>
        <button data-tab="analytics" onclick="PFOS.setTab('analytics')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="pie-chart" class="w-4 h-4"></i> Analytics &amp; Net Worth</button>
        <button data-tab="settings" onclick="PFOS.setTab('settings')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"><i data-lucide="database" class="w-4 h-4"></i> SQLite Vault &amp; APK</button>
      </nav>
    </div>

    <div class="space-y-2.5 pt-4 border-t border-slate-800/80">
      <button onclick="PFOS.openApkModal()" class="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-xs shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
        <i data-lucide="smartphone" class="w-4 h-4"></i> Get Android APK / Install
      </button>
      <div class="flex items-center justify-between px-2 text-[11px] text-slate-400">
        <span id="sidebar-sqlite-status" class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Booting SQLite...</span>
        <span class="text-slate-500">₹0 Cost</span>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN CONTENT WRAPPER ==================== -->
  <div class="flex-1 flex flex-col min-w-0 pb-24 md:pb-8">
    <header class="sticky top-0 z-30 bg-obsidian/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="md:hidden w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-extrabold text-sm shrink-0">₹</div>
        <div class="min-w-0">
          <h2 id="header-title" class="text-base md:text-lg font-bold tracking-tight truncate">Money Commitments</h2>
          <p class="text-[11px] text-slate-400 truncate hidden sm:block">AES-256 Encrypted SQLite (OPFS + IndexedDB) • Zero Cloud • ₹0 Cost</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <select id="mobile-profile-select" onchange="PFOS.switchProfile(this.value)" class="md:hidden bg-card border border-slate-700/80 rounded-lg px-2 py-1.5 text-[11px] font-medium text-slate-200 max-w-[84px]">
          <option value="ALL">All</option>
          <option value="PERSONAL">Personal</option>
          <option value="FAMILY">Family</option>
          <option value="BUSINESS">Business</option>
        </select>

        <button onclick="PFOS.exportSqliteFile()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 text-xs font-semibold transition active:scale-95" title="Download pfos_vault.sqlite">
          <i data-lucide="database" class="w-3.5 h-3.5"></i><span>Save .sqlite</span>
        </button>

        <button onclick="PFOS.openApkModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-400 text-xs font-semibold transition active:scale-95">
          <i data-lucide="download" class="w-3.5 h-3.5"></i><span>Get APK</span>
        </button>

        <button id="header-lock-btn" onclick="PFOS.lockVaultNow()" class="hidden p-2 rounded-xl bg-card hover:bg-slate-800 border border-slate-700/80 text-emerald-400 transition" title="Lock Encrypted Vault">
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <main id="app-view" class="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 space-y-5 animate-fade-in">
      <div class="flex flex-col items-center justify-center py-20 text-slate-400 text-xs gap-3">
        <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p>Opening local SQLite vault...</p>
      </div>
    </main>
  </div>

  <!-- ==================== MOBILE BOTTOM NAVIGATION ==================== -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-surface/95 backdrop-blur-lg border-t border-slate-800 px-2 py-1.5 flex items-center justify-around">
    <button data-tab="home" onclick="PFOS.setTab('home')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Home</span></button>
    <button data-tab="accounts" onclick="PFOS.setTab('accounts')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="wallet" class="w-5 h-5"></i><span>Accounts</span></button>
    <button data-tab="timeline" onclick="PFOS.setTab('timeline')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="list-ordered" class="w-5 h-5"></i><span>Timeline</span></button>
    <button data-tab="planning" onclick="PFOS.setTab('planning')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="calendar-clock" class="w-5 h-5"></i><span>Plan</span></button>
    <button data-tab="analytics" onclick="PFOS.setTab('analytics')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="pie-chart" class="w-5 h-5"></i><span>Stats</span></button>
    <button data-tab="settings" onclick="PFOS.setTab('settings')" class="m-nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl text-[10px] font-medium transition"><i data-lucide="database" class="w-5 h-5"></i><span>Vault</span></button>
  </nav>

  <!-- ==================== UNIVERSAL MODAL CONTAINER ==================== -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target === this) PFOS.closeModal()">
    <div id="modal-content" class="w-full sm:max-w-lg max-h-[92vh] overflow-y-auto bg-surface border border-slate-800 rounded-t-3xl sm:rounded-3xl shadow-2xl p-5 sm:p-6 animate-fade-in"></div>
  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container" class="fixed top-16 right-4 z-[90] flex flex-col gap-2 pointer-events-none max-w-xs w-full"></div>

  <!-- Hidden file inputs -->
  <input type="file" id="pfos-import-input" accept=".pfos,.json" class="hidden" onchange="PFOS.handleBackupImport(event)" />
  <input type="file" id="sqlite-import-input" accept=".sqlite,.db,.sqlite3" class="hidden" onchange="PFOS.handleSqliteImport(event)" />

  <script src="./db-engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
